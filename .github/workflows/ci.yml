name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Full check (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install development dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all checks
        run: pnpm check
      - name: Pack the checked package
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  package-node-22:
    name: Package install (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22']
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package
      - name: Install the archive and load ESM and CommonJS
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/package
        run: |
          set -euo pipefail
          tarballs=("$PACKAGE_DIRECTORY"/*.tgz)
          test "${#tarballs[@]}" -eq 1
          test -f "${tarballs[0]}"

          consumer="$(mktemp -d)"
          cd "$consumer"
          printf '%s\n' '{"name":"lean-fns-ci-consumer","private":true}' > package.json
          npm install "${tarballs[0]}" --offline --ignore-scripts --engine-strict --no-audit --no-fund --package-lock=false

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import * as library from 'lean-fns';

          assert.equal(typeof library, 'object');
          const state = { count: 1 };
          assert.deepEqual(library.updateIn(state, ['count'], value => value + 1), { count: 2 });
          assert.deepEqual(state, { count: 1 });
          assert.equal(fileURLToPath(import.meta.resolve('lean-fns')), resolve('node_modules/lean-fns/dist/index.js'));
          console.log(`ESM OK on ${process.version}`);
          NODE

          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { resolve } = require('node:path');
          const library = require('lean-fns');

          assert.equal(typeof library, 'object');
          const state = { count: 1 };
          assert.deepEqual(library.updateIn(state, ['count'], value => value + 1), { count: 2 });
          assert.deepEqual(state, { count: 1 });
          assert.equal(require.resolve('lean-fns'), resolve('node_modules/lean-fns/dist/index.cjs'));
          const metadata = require('lean-fns/package.json');
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            assert.deepEqual(Object.keys(metadata[field] ?? {}), []);
          }
          console.log(`CommonJS OK on ${process.version}; zero runtime dependencies`);
          NODE
